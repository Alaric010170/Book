services:
  # ========== MySQL ==========
  mysql:
    image: mysql:8.0
    container_name: lms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-library_db}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"   # 宿主机用 3307（避开本地已有的 MySQL80 的 3306）
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    ports:
      - "6380:6379"   # 宿主机用 6380（避开本地已有的 Redis 6379）
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 后端 Spring Boot ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-library_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8081:8080"   # 宿主机用 8081（避开本地已运行的后端 8080）
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ========== 前端 Vue + Nginx ==========
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-frontend
    restart: unless-stopped
    ports:
      - "8082:80"    # 宿主机 8082 → Nginx 80
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
